<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7e6b5">
<title>Sine Rally · Engine Sim</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="top">
  <h1 class="ink">SINE RALLY <span>ENGINE SIM</span></h1>
  <span id="status" class="tag">tap to start</span>
  <button id="cfg-btn" class="btn">⚙ TUNE</button>
</header>

<main id="stage">
  <canvas id="viz"></canvas>
  <div id="pedals">
    <button class="pedal brake" data-k="brake"><b>BRAKE</b><small>S / ↓</small></button>
    <button class="pedal nitro" data-k="nitro"><b>NITRO</b><small>SHIFT / SPACE</small></button>
    <button class="pedal gas" data-k="gas"><b>GAS</b><small>W / ↑</small></button>
  </div>
</main>

<aside id="panel">
  <div id="panel-head"><h2 class="ink">TUNE THE ENGINE</h2><button id="panel-close" class="btn">✕</button></div>
  <div id="panel-body"></div>
</aside>

<div id="start">
  <div class="card">
    <h2 class="ink">SINE RALLY<br><span>ENGINE SIM</span></h2>
    <p>Build any engine. Every cylinder's light flashes the instant it fires.</p>
    <button class="btn big">🔊 TAP TO START ENGINE</button>
    <p class="small">GAS · BRAKE · NITRO — or W / S / SHIFT. iPhone: turn the volume up (silent switch is ignored on iOS 17+).</p>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
